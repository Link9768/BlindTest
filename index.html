<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DJ Set</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --darkblue: #001f46;
      --blue: #022d5a;
      --bg: #002e5c;
      --bluegris: #3982a3;
      --blueciel: #61c3d3;
      --rose: #f39fa3;
      --rouge: #e8375f;
      --orange: #f59923;
      --vert: #77ba4e;
      --jaune: #fecd4f;
      --answer-bg: rgba(0, 80, 137, 0.51);
    }

    body {
      background: var(--bg);
      color: #fff;
      font-family: 'Arial Rounded MT Bold', 'Nunito', 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .screen {
      height: 100vh;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .screen.visible { display: flex; }

    /* ─── Fond rainures radiales ─── */
    #screen-player {
      background:
        repeating-radial-gradient(circle at 50% 20%,
          transparent 0px, transparent 16px,
          rgba(120, 180, 255, 0.06) 16px, rgba(120, 180, 255, 0.06) 18px),
        radial-gradient(circle at 50% 20%, #0a4a8a 0%, var(--blue) 35%, var(--darkblue) 100%);
    }

    h1 {
      margin-top: 20px;
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ═══════════ ÉCRAN MENU ═══════════ */
    #screen-menu {
      background:
        repeating-radial-gradient(circle at 50% 30%,
          transparent 0px, transparent 16px,
          rgba(120, 180, 255, 0.05) 16px, rgba(120, 180, 255, 0.05) 18px),
        radial-gradient(circle at 50% 30%, #0a4a8a 0%, var(--blue) 40%, var(--darkblue) 100%);
      justify-content: flex-start;
      gap: 30px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 30px 0;
    }

    #themes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      width: 92%;
      max-width: 640px;
    }

    .theme-tile {
      background: var(--answer-bg);
      border: none;
      border-radius: 16px;
      color: #fff;
      padding: 20px 10px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      transition: transform 0.15s, background 0.15s;
    }
    .theme-tile:hover { transform: scale(1.04); background: rgba(0, 80, 137, 0.75); }

    .theme-dot {
      width: 34px; height: 34px;
      border-radius: 50%;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.35);
    }

    #btn-spotify-login {
      background: #1db954;
      border: none;
      border-radius: 30px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 12px 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #btn-spotify-login:hover { filter: brightness(1.1); }
    /* Connecté : le bouton devient un simple indicateur, plus un bouton d'action */
    #btn-spotify-login:disabled { cursor: default; opacity: 0.85; }
    /* Diagnostic affiché à l'écran (console inaccessible sur mobile) */
    #diag {
      display: none;
      max-width: 90%;
      font-size: 0.7rem;
      line-height: 1.4;
      color: #ffd27a;
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 8px 12px;
      text-align: center;
      word-break: break-all;
    }

    /* ═══════════ ÉCRAN PLAYER ═══════════ */

    #btn-menu {
      position: absolute;
      top: 16px; left: 20px;
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0.85;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 5;
    }
    #btn-menu:hover { opacity: 1; }

    /* ─── Disques (cluster superposé, style olemains) ─── */
    #disques-zone {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .disques-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .disc {
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: width 0.4s ease, height 0.4s ease, margin 0.4s ease, opacity 0.4s ease;
      width: 46px; height: 46px;
      margin-left: -28px;
      opacity: 0.9;
      box-shadow: 0 0 14px rgba(0,0,0,0.4);
    }
    .disc:first-child { margin-left: 0; }

    .disc.active {
      width: 180px; height: 180px;
      opacity: 1;
      z-index: 3;
      box-shadow: 0 0 0 10px rgba(0,20,50,0.55), 0 0 60px rgba(0,0,0,0.6);
      animation: spin 8s linear infinite;
      animation-play-state: paused;
    }
    .disc.active.playing { animation-play-state: running; }

    .disc.near1 { width: 78px; height: 78px; z-index: 2; }
    .disc.near2 { width: 56px; height: 56px; z-index: 1; }

    /* Sillons vinyle : arcs blancs haut/bas comme olemains */
    .disc::before {
      content: '';
      position: absolute;
      inset: 6%;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle at center,
        transparent 0px, transparent 4px,
        rgba(255,255,255,0.35) 4px, rgba(255,255,255,0.35) 5px
      );
      -webkit-mask: linear-gradient(180deg, #000 0%, transparent 38%, transparent 62%, #000 100%);
      mask: linear-gradient(180deg, #000 0%, transparent 38%, transparent 62%, #000 100%);
    }

    .disc-label {
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      z-index: 1;
      position: relative;
      transition: width 0.4s ease, height 0.4s ease, font-size 0.4s ease;
      width: 22px; height: 22px;
      font-size: 0.6rem;
    }
    .disc.active .disc-label { width: 64px; height: 64px; font-size: 1.8rem; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ─── Bandeau réponse pleine largeur ─── */
    #btn-reponse {
      background: var(--answer-bg);
      border: none;
      color: #fff;
      width: 100%;
      padding: 26px;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
      margin-bottom: 24px;
    }
    #btn-reponse:hover { background: rgba(0, 80, 137, 0.7); }
    #btn-reponse .icon { font-size: 1.3rem; }
    #reponse-text {
      font-size: 1.7rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: none;
    }
    #btn-reponse.revealed .label-default { display: none; }
    #btn-reponse.revealed #reponse-text { display: block; }

    /* ─── Zone play : bouton play centré + anneau timer vert ─── */
    #play-zone {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 26px;
    }

    /* L'iframe Spotify est totalement masquée : on ne dépend plus de sa mise en
       page (elle change entre les états et le bouton se déplaçait). Le contrôle
       passe par le SDK, l'affichage par notre propre bouton ci-dessous. */
    #spotify-window {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
    }

    /* Notre bouton play/pause : position fixe, 2 états seulement */
    #btn-play {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      border: none;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      z-index: 2;
    }
    #btn-play svg { width: 26px; height: 26px; fill: var(--darkblue); }
    #btn-play .icon-pause { display: none; }
    #btn-play.playing .icon-play  { display: none; }
    #btn-play.playing .icon-pause { display: block; }
    #btn-play:disabled { opacity: 0.5; cursor: default; }

    /* Anneau sombre autour du play */
    #play-ring {
      position: absolute;
      inset: 0;
      z-index: 1;
    }
    #ring-bg {
      fill: none;
      stroke: var(--darkblue);
      stroke-width: 10;
    }
    /* Petit segment vert qui tourne autour de l'anneau (progression 30s) */
    #timer-circle {
      fill: none;
      stroke: var(--vert);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 22 261;
      stroke-dashoffset: 0;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
    #timer-circle.done { stroke: var(--rouge); }

    #no-track {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      z-index: 3;
    }
    #play-zone.empty #no-track { display: flex; }
    #play-zone.empty #btn-play { display: none; }

    /* ─── Navigation ─── */
    #nav-bar {
      position: absolute;
      bottom: 30px; right: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    #progress-text {
      font-size: 0.85rem;
      opacity: 0.5;
      letter-spacing: 0.1em;
    }

    #btn-suivant {
      background: none;
      border: none;
      color: #fff;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.9;
    }
    #btn-suivant:hover { opacity: 1; }
    #btn-suivant .arrow { font-size: 1.3rem; }
    #btn-suivant:disabled { opacity: 0.3; cursor: default; }

    /* ─── + d'infos (bulle avec titre + artiste) ─── */
    #btn-infos {
      position: absolute;
      right: 30px;
      bottom: 96px;
      background: var(--blue);
      border: 2px solid #4a90c2;
      border-radius: 20px;
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 8px 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 6;
    }
    #btn-infos.visible { display: flex; }
    #btn-infos::after {
      content: '';
      position: absolute;
      bottom: -8px; right: 22px;
      width: 14px; height: 14px;
      background: var(--blue);
      border-right: 2px solid #4a90c2;
      border-bottom: 2px solid #4a90c2;
      transform: rotate(45deg);
    }

    #infos-popup {
      position: absolute;
      right: 30px;
      bottom: 138px;
      max-width: 260px;
      background: var(--darkblue);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      text-align: right;
      display: none;
      z-index: 6;
    }
    #infos-popup.visible { display: block; }
    #infos-popup .titre { font-weight: 900; display: block; }
    #infos-popup .artiste { opacity: 0.7; font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- ═══════════ ÉCRAN MENU ═══════════ -->

    <h1>DJ Set</h1>
    <div id="themes-grid"><!-- généré par JS --></div>
    <button id="btn-spotify-login" onclick="spotifyLogin()">● Connexion Spotify</button>
    <p id="diag"></p>
  </div>

  <!-- ═══════════ ÉCRAN PLAYER ═══════════ -->

    <div id="disques-zone">

    </div>

    <button id="btn-reponse" onclick="toggleReponse()">
      <span class="label-default icon">👁</span>
      <span class="label-default">Voir la réponse</span>
      <span id="reponse-text"></span>
    </button>

    <div id="play-zone">
      <svg id="play-ring" viewBox="0 0 110 110">
        <circle id="ring-bg" cx="55" cy="55" r="45"/>
        <circle id="timer-circle" cx="55" cy="55" r="45"/>
      </svg>
      <div id="spotify-window"><div id="spotify-embed"></div></div>
      <button id="btn-play" onclick="togglePlay()" disabled>
        <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <div id="no-track">🚫</div>
    </div>

    <div id="infos-popup">
      <span class="titre" id="infos-titre"></span>
      <span class="artiste" id="infos-artiste"></span>
    </div>
    <button id="btn-infos" onclick="toggleInfos()">+ d'infos</button>

    <div id="nav-bar">
      <span id="progress-text"></span>
      <button id="btn-suivant" onclick="suivant()">Suivant <span class="arrow">→</span></button>

    //   1. Web Playback SDK (si connecté + Premium) : morceaux COMPLETS, pas
    //      d'iframe, donc pas de latence de rechargement ni de blocage autoplay.
    //   2. IFrame embed (fallback) : extraits 30s, comportement historique.
    //      Utilisé si non connecté, pas Premium, ou SDK indisponible.
    // ═══════════════════════════════════════════════════════════════════════
    const SPOTIFY_CLIENT_ID = 'f6fe565d7cfc4eb5878edd275891b46b';
    const REDIRECT_URI = location.origin + location.pathname;
    const SCOPES = 'streaming user-read-email user-read-private user-modify-playback-state';

    let useSdk = false;          // true = Web Playback SDK actif
    let sdkPlayer = null;
    let sdkDeviceId = null;

    // ─── OAuth PKCE ────────────────────────────────────────────────────────
    function randomString(len) {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
      return Array.from(crypto.getRandomValues(new Uint8Array(len)))
        .reduce((acc, x) => acc + chars[x % chars.length], '');
    }

    function base64url(buf) {
      return btoa(String.fromCharCode(...new Uint8Array(buf)))
        .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
    }

    // URL d'autorisation préparée au chargement (pas au clic) : sur mobile, une
    // redirection déclenchée APRÈS un await sort du geste utilisateur et se fait
    // bloquer par le navigateur — le clic doit rediriger de façon synchrone.
    let authUrlReady = null;
    let prepareError = null;

    async function prepareAuthUrl() {
      try {
        const verifier = randomString(64);
        const hashed = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
        const url = new URL('https://accounts.spotify.com/authorize');
        url.search = new URLSearchParams({
          response_type: 'code',
          client_id: SPOTIFY_CLIENT_ID,
          scope: SCOPES,
          code_challenge_method: 'S256',
          code_challenge: base64url(hashed),
          redirect_uri: REDIRECT_URI,
        }).toString();
        authUrlReady = { url: url.toString(), verifier };
      } catch (e) {
        // crypto.subtle indisponible (contexte non sécurisé / navigateur ancien)
        authUrlReady = null;
        prepareError = (e && e.message) ? e.message : String(e);
      }
    }

    // Affiche l'état à l'écran : impossible de lire la console d'un téléphone,
    // donc l'app doit dire elle-même ce qui bloque.
    function diag(msg) {
      const el = document.getElementById('diag');
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }

    function spotifyLogin() {
      try {
        if (!authUrlReady) {
          diag('Bloqué : URL non préparée. crypto.subtle=' + (window.crypto && crypto.subtle ? 'ok' : 'ABSENT') +
               ' | secure=' + window.isSecureContext + ' | erreur=' + (prepareError || 'aucune'));
          return;
        }
        localStorage.setItem('sp_verifier', authUrlReady.verifier);
        diag('Redirection en cours…');
        location.href = authUrlReady.url;
        // Si après 1,5s on est toujours là, c'est que la navigation a été bloquée
        setTimeout(() => diag('Redirection bloquée par le navigateur. URL : ' + authUrlReady.url), 1500);
      } catch (e) {
        diag('Erreur au clic : ' + (e && e.message ? e.message : e));
      }
    }

    async function exchangeCode(code) {
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: SPOTIFY_CLIENT_ID,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: localStorage.getItem('sp_verifier') || '',
        }),
      });
      if (!res.ok) return null;
      return storeToken(await res.json());
    }

    async function refreshToken() {
      const rt = localStorage.getItem('sp_refresh');
      if (!rt) return null;
      const res = await fetch('https://accounts.spotify.com/api/token', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: new URLSearchParams({
          client_id: SPOTIFY_CLIENT_ID,
          grant_type: 'refresh_token',
          refresh_token: rt,
        }),
      });
      if (!res.ok) return null;
      return storeToken(await res.json());
    }

    function storeToken(data) {
      if (!data.access_token) return null;
      localStorage.setItem('sp_token', data.access_token);
      localStorage.setItem('sp_expires', Date.now() + (data.expires_in - 60) * 1000);
      if (data.refresh_token) localStorage.setItem('sp_refresh', data.refresh_token);
      return data.access_token;
    }

    // Renvoie un token valide, rafraîchi si nécessaire ; null si non connecté
    async function getToken() {
      const token = localStorage.getItem('sp_token');
      const exp = Number(localStorage.getItem('sp_expires') || 0);
      if (token && Date.now() < exp) return token;
      return refreshToken();
    }

    // ─── Web Playback SDK ──────────────────────────────────────────────────
    window.onSpotifyWebPlaybackSDKReady = async () => {
      const token = await getToken();
      if (!token) return; // pas connecté → on reste sur le fallback iframe

      sdkPlayer = new Spotify.Player({
        name: 'DJ Set',
        getOAuthToken: async (cb) => { const t = await getToken(); if (t) cb(t); },
        volume: 0.8,
      });

      sdkPlayer.addListener('ready', ({ device_id }) => {
        sdkDeviceId = device_id;
        useSdk = true;
        updateLoginUi();
        if (currentUri) btnPlay.disabled = false;
      });

      // Premium requis : sans ça le SDK refuse de démarrer → on garde l'iframe
      sdkPlayer.addListener('account_error', () => { useSdk = false; updateLoginUi(); });
      sdkPlayer.addListener('initialization_error', () => { useSdk = false; });
      sdkPlayer.addListener('authentication_error', () => {
        localStorage.removeItem('sp_token');
        useSdk = false;
        updateLoginUi();
      });

      sdkPlayer.addListener('player_state_changed', (state) => {
        if (!state) return;
        btnPlay.classList.toggle('playing', !state.paused);
        if (!state.paused && !isPlaying) startPlay();
        if (state.paused && isPlaying) pauseTimer();
      });

      sdkPlayer.connect();
    };

    // ─── Fallback : IFrame embed (extraits 30s) ────────────────────────────
    let embedController = null;
    let embedReady = false;
    let pendingUri = null;

    window.onSpotifyIframeApiReady = (IFrameAPI) => {
      IFrameAPI.createController(
        document.getElementById('spotify-embed'),
        { width: 300, height: 80, uri: 'spotify:track:49wOjOkS4pBK3PQnPnNYjb' },
        (controller) => {
          embedController = controller;
          embedReady = true;
          controller.addListener('playback_update', (e) => {
            if (useSdk) return; // le SDK pilote, on ignore l'iframe
            const paused = e.data.isPaused;
            btnPlay.classList.toggle('playing', !paused);
            if (!paused && !isPlaying) startPlay();
            if (paused && isPlaying) pauseTimer();
          });
          if (pendingUri) { loadTrack(pendingUri); pendingUri = null; }
        }
      );
    };

    // ─── API commune (le reste du code ne sait pas quel moteur tourne) ─────
    function loadTrack(uri) {
      const changed = uri !== currentUri;
      currentUri = uri;
      btnPlay.classList.remove('playing');

      if (useSdk) {
        // Coupe le morceau précédent, sinon il continue pendant qu'on en choisit un autre
        if (changed && sdkPlayer) sdkPlayer.pause();
        btnPlay.disabled = false;
        return; // le morceau sera lancé au clic play (position_ms: 0)
      }
      if (!embedReady) { pendingUri = uri; return; }
      embedController.loadUri(uri);
      setTimeout(() => embedController.seek(0), 300);
      btnPlay.disabled = false;
    }

    async function togglePlay() {
      if (useSdk) {
        const state = await sdkPlayer.getCurrentState();
        // Rien en cours (ou autre morceau) → on démarre celui-ci depuis le début
        if (!state || state.track_window?.current_track?.uri !== currentUri) {
          const token = await getToken();
          await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${sdkDeviceId}`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ uris: [currentUri], position_ms: 0 }),
          });
        } else {
          await sdkPlayer.togglePlay();
        }
        return;
      }
      if (embedReady) embedController.togglePlay();
    }

    function stopTrack() {
      if (useSdk && sdkPlayer) sdkPlayer.pause();
      else if (embedReady) embedController.pause();
      btnPlay.classList.remove('playing');
    }

    function updateLoginUi() {
      const btn = document.getElementById('btn-spotify-login');
      if (!btn) return;
      btn.textContent = useSdk ? '✓ Spotify connecté — morceaux complets' : '● Connexion Spotify';
      btn.disabled = useSdk;
    }

    // Au chargement : récupère le code OAuth s'il y en a un dans l'URL,
    // puis prépare l'URL d'autorisation pour que le prochain clic soit synchrone
    (async () => {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      if (code) {
        await exchangeCode(code);
        // Nettoie l'URL (retire ?code=...) sans recharger la page
        history.replaceState({}, '', REDIRECT_URI);
      }
      updateLoginUi();
      await prepareAuthUrl();
    })();

    // ═══ MENU ══════════════════════════════════════════════════════════════
    themes.forEach((t, i) => {
      const btn = document.createElement('button');
      btn.className = 'theme-tile';
      btn.innerHTML = `<span class="theme-dot" style="background:${t.couleur}"></span>${t.nom}`;
      btn.onclick = () => openTheme(i);
      themesGrid.appendChild(btn);
    });

    function openTheme(i) {
      themeActif = themes[i];
      current = 0;
      themeTitle.textContent = themeActif.nom;
      buildDiscs();
      screenMenu.classList.remove('visible');
      screenPlayer.classList.add('visible');
      render();
    }

    function showMenu() {
      stopPlay();
      stopTrack();
      screenPlayer.classList.remove('visible');
      screenMenu.classList.add('visible');
    }

    // ═══ DISQUES ═══════════════════════════════════════════════════════════
    function buildDiscs() {
      wrapper.innerHTML = '';
      themeActif.morceaux.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'disc';
        div.id = `disc-${i}`;
        div.style.background = `radial-gradient(circle at 35% 35%, ${COULEURS_DISQUES[i]}, ${COULEURS_DISQUES[i]} 55%, rgba(0,0,0,0.35))`;
        div.style.backgroundColor = COULEURS_DISQUES[i];
        div.innerHTML = `<div class="disc-label" style="color:${COULEURS_DISQUES[i]}">${m.num}</div>`;
        div.onclick = () => { current = i; render(); };
        wrapper.appendChild(div);
      });
    }

    function render() {
      const m = themeActif.morceaux[current];
      progressText.textContent = `${m.num} / 7`;
      btnSuivant.disabled = current === themeActif.morceaux.length - 1;

      themeActif.morceaux.forEach((_, i) => {
        const el = document.getElementById(`disc-${i}`);
        const dist = Math.abs(i - current);
        el.classList.remove('active', 'near1', 'near2', 'playing');
        if (i === current) el.classList.add('active');
        else if (dist === 1) el.classList.add('near1');
        else if (dist === 2) el.classList.add('near2');
      });

      if (m.spotifyId) {
        playZone.classList.remove('empty');
        loadTrack(`spotify:track:${m.spotifyId}`);
      } else {
        playZone.classList.add('empty');
        stopTrack();
      }

      resetTimer();
      stopPlay();
      hideReponse();
    }

    function startPlay() {
      isPlaying = true;
      const d = document.getElementById(`disc-${current}`);
      if (d) d.classList.add('playing');
      startTimer();
    }

    function pauseTimer() {
      isPlaying = false;
      const d = document.getElementById(`disc-${current}`);
      if (d) d.classList.remove('playing');
      // fige la progression au moment de la pause
      elapsedMs = performance.now() - playStartTs;
      cancelAnimationFrame(rafId);
    }

    function stopPlay() {
      isPlaying = false;
      const d = document.getElementById(`disc-${current}`);
      if (d) d.classList.remove('playing');
      cancelAnimationFrame(rafId);
    }

    // ═══ TIMER (animation fluide via requestAnimationFrame) ═══════════════════
    let elapsedMs = 0;      // temps écoulé cumulé (survit aux pauses)
    let playStartTs = 0;    // timestamp du dernier démarrage
    let rafId = null;

    function startTimer() {
      cancelAnimationFrame(rafId);
      playStartTs = performance.now() - elapsedMs;
      tick();
    }

    function tick() {
      const elapsed = performance.now() - playStartTs;
      const progress = Math.min(elapsed / (TIMER_DURATION * 1000), 1);
      // segment vert tourne sens horaire : offset négatif = avance sur le cercle
      timerCircle.style.strokeDashoffset = -CIRCUMFERENCE * progress;
      if (progress >= 1) {
        timerCircle.classList.add('done');
        stopPlay();
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function resetTimer() {
      cancelAnimationFrame(rafId);
      elapsedMs = 0;
      timerCircle.style.strokeDashoffset = 0;
      timerCircle.classList.remove('done');
    }

    // ═══ RÉPONSE ═══════════════════════════════════════════════════════════
    function toggleReponse() {
      if (!reponseVisible) {
        const m = themeActif.morceaux[current];
        reponseText.textContent = m.reponse;
        btnReponse.classList.add('revealed');
        reponseVisible = true;
        btnInfos.classList.toggle('visible', !!m.artiste);
      } else {
        hideReponse();
      }
    }

    function hideReponse() {
      btnReponse.classList.remove('revealed');
      reponseVisible = false;
      btnInfos.classList.remove('visible');
      hideInfos();
    }

    // ═══ + D'INFOS ═════════════════════════════════════════════════════════
    let infosVisible = false;

    function toggleInfos() {
      const m = themeActif.morceaux[current];
      if (!infosVisible) {
        infosTitre.textContent = m.titre || m.reponse;
        infosArtiste.textContent = m.artiste;
        infosPopup.classList.add('visible');
        infosVisible = true;
      } else {
        hideInfos();
      }
    }

    function hideInfos() {
      infosPopup.classList.remove('visible');
      infosVisible = false;
    }

    // ═══ NAVIGATION ════════════════════════════════════════════════════════
    function suivant() {
      if (current < themeActif.morceaux.length - 1) {
        current++;
        render();
      }
    }
  </script>

       exister avant que ces scripts (async) ne s'exécutent et les appellent. -->
  <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
  <script src="https://sdk.scdn.co/spotify-player.js" async></script>
